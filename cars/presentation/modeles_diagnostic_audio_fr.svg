<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091526"/><stop offset=".55" stop-color="#102a40"/><stop offset="1" stop-color="#101b30"/></linearGradient>
 <linearGradient id="c1" x2="1" y2="1"><stop stop-color="#164563"/><stop offset="1" stop-color="#122c43"/></linearGradient>
 <linearGradient id="c2" x2="1" y2="1"><stop stop-color="#155251"/><stop offset="1" stop-color="#12343e"/></linearGradient>
 <linearGradient id="c3" x2="1" y2="1"><stop stop-color="#59421f"/><stop offset="1" stop-color="#392e20"/></linearGradient>
 <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
 <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L10 6 1 11" fill="none" stroke="#75ddd1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f2f7fc}.eyebrow{font-size:16px;letter-spacing:2.5px;font-weight:700;fill:#76ded2}.title{font-size:43px;font-weight:760}.sub{font-size:19px;fill:#a9c0d3}.section{font-size:21px;font-weight:750}.head{font-size:19px;font-weight:700}.body{font-size:16px;fill:#d5e2eb}.muted{font-size:14px;fill:#aac1d1}.pill{font-size:13px;font-weight:750;letter-spacing:1px}</style>
</defs>
<rect width="1800" height="1200" fill="url(#bg)"/>
<circle cx="1630" cy="90" r="260" fill="#2b8281" opacity=".10"/><circle cx="120" cy="1110" r="300" fill="#3477a7" opacity=".10"/>
<text x="100" y="75" class="eyebrow">DIAGNOSTIC AUTOMOBILE PAR ANALYSE AUDIO</text>
<text x="100" y="133" class="title">Modèles utilisés et architecture</text>
<text x="100" y="170" class="sub">Panorama des méthodes testées sur les enregistrements du moteur et des composants</text>

<!-- data pipeline -->
<g filter="url(#sh)">
 <rect x="90" y="205" width="300" height="120" rx="19" fill="url(#c1)" stroke="#327aa1"/>
 <rect x="445" y="205" width="370" height="120" rx="19" fill="url(#c1)" stroke="#327aa1"/>
 <rect x="870" y="205" width="350" height="120" rx="19" fill="url(#c1)" stroke="#327aa1"/>
 <rect x="1275" y="205" width="425" height="120" rx="19" fill="url(#c1)" stroke="#327aa1"/>
</g>
<text x="120" y="245" class="pill" fill="#76ded2">DONNÉES</text><text x="120" y="278" class="head">1 386 fichiers WAV</text><text x="120" y="303" class="muted">Braking · Idle · Startup</text>
<text x="475" y="245" class="pill" fill="#76ded2">SIGNAL AUDIO</text><text x="475" y="278" class="head">16 kHz · filtre 300–7 000 Hz</text><text x="475" y="303" class="muted">Fenêtres 1 s · chevauchement 50 %</text>
<text x="900" y="245" class="pill" fill="#76ded2">REPRÉSENTATION</text><text x="900" y="278" class="head">65 caractéristiques par fenêtre</text><text x="900" y="303" class="muted">Temporelles · spectrales · Wavelet db4</text>
<text x="1305" y="245" class="pill" fill="#76ded2">ÉVALUATION</text><text x="1305" y="278" class="head">Découpage par enregistrement WAV</text><text x="1305" y="303" class="muted">Les fenêtres d’un fichier restent ensemble</text>
<path d="M395 265H432" stroke="#75ddd1" stroke-width="3" marker-end="url(#a)"/><path d="M820 265H857" stroke="#75ddd1" stroke-width="3" marker-end="url(#a)"/><path d="M1225 265H1262" stroke="#75ddd1" stroke-width="3" marker-end="url(#a)"/>

<text x="100" y="390" class="section">1 · Détection normal / anormal</text>
<text x="100" y="419" class="muted">Deux familles de modèles ont été comparées sur les mêmes fichiers.</text>
<g filter="url(#sh)">
 <rect x="100" y="445" width="760" height="215" rx="20" fill="url(#c2)" stroke="#3c9a92"/>
 <rect x="900" y="445" width="800" height="215" rx="20" fill="url(#c1)" stroke="#4588af"/>
</g>
<rect x="130" y="470" width="166" height="28" rx="14" fill="#226c67"/><text x="213" y="489" text-anchor="middle" class="pill">SUPERVISÉ</text>
<text x="130" y="535" class="head">XGBoost binaire</text>
<text x="130" y="568" class="body">• Sélection ANOVA · 60 caractéristiques</text><text x="130" y="596" class="body">• Sélection JSD · 60 caractéristiques</text>
<text x="130" y="631" class="muted">Seuil calibré sur les WAV normaux de validation</text>
<rect x="930" y="470" width="205" height="28" rx="14" fill="#24587b"/><text x="1032" y="489" text-anchor="middle" class="pill">NON SUPERVISÉ</text>
<text x="930" y="535" class="head">Autoencodeur MLP</text><text x="930" y="568" class="body">Entraîné seulement avec les enregistrements normaux</text>
<text x="930" y="596" class="body">Score fondé sur l’erreur de reconstruction des 65 caractéristiques</text><text x="930" y="631" class="muted">Seuil choisi à partir des données normales de validation</text>

<text x="100" y="722" class="section">2 · Identification du type de panne</text>
<text x="100" y="751" class="muted">Les classificateurs sont entraînés sur les fichiers anormaux; leurs résultats varient selon les classes.</text>
<g filter="url(#sh)">
 <rect x="100" y="778" width="510" height="228" rx="20" fill="url(#c3)" stroke="#b88a43"/>
 <rect x="645" y="778" width="510" height="228" rx="20" fill="url(#c2)" stroke="#3c9a92"/>
 <rect x="1190" y="778" width="510" height="228" rx="20" fill="url(#c1)" stroke="#4588af"/>
</g>
<rect x="130" y="802" width="160" height="28" rx="14" fill="#765525"/><text x="210" y="821" text-anchor="middle" class="pill">MULTICLASSE</text>
<text x="130" y="865" class="head">XGBoost</text><text x="130" y="897" class="body">• Sélection ANOVA</text><text x="130" y="925" class="body">• Sélection JSD</text><text x="130" y="972" class="muted">10 catégories de panne</text>
<rect x="675" y="802" width="185" height="28" rx="14" fill="#226c67"/><text x="767" y="821" text-anchor="middle" class="pill">CLASSIFICATION</text>
<text x="675" y="865" class="head">Random Forest</text><text x="675" y="897" class="body">65 caractéristiques audio</text><text x="675" y="925" class="body">Meilleur modèle comparé pour le type de panne</text><text x="675" y="972" class="muted">Macro-F1 test : 0,651 sur le split étudié</text>
<rect x="1220" y="802" width="175" height="28" rx="14" fill="#24587b"/><text x="1307" y="821" text-anchor="middle" class="pill">AUTRES ESSAIS</text>
<text x="1220" y="865" class="head">SVM RBF · CNN log-Mel</text><text x="1220" y="897" class="body">SVM : caractéristiques audio</text><text x="1220" y="925" class="body">CNN : spectrogrammes, 64 bandes Mel</text><text x="1220" y="972" class="muted">Comparés; non retenus comme meilleur candidat</text>

<!-- bottom row -->
<text x="100" y="1060" class="section">3 · Diagnostic combiné et pannes spécifiques</text>
<g filter="url(#sh)"><rect x="100" y="1080" width="770" height="80" rx="18" fill="#142e3c" stroke="#4b7f80"/><rect x="900" y="1080" width="800" height="80" rx="18" fill="#192a3d" stroke="#526d8b"/></g>
<text x="130" y="1115" class="head">Cascade hybride : XGBoost → Random Forest</text><text x="130" y="1143" class="muted">Détecter d’abord, diagnostiquer ensuite si le WAV est anormal.</text>
<text x="930" y="1115" class="head">6 spécialistes Random Forest binaires</text><text x="930" y="1143" class="muted">Freins · allumage · batterie · huile · direction assistée · courroie</text>

<text x="100" y="1185" class="muted">JSD et ANOVA sont des méthodes de sélection de caractéristiques, pas des modèles de classification.</text>
</svg>
